name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[gru,dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
